[project]
name = "agent-factory"
version = "0.1.0"
description = "A Software Agent Factory: a Strands Graph of cheap Bedrock models with a System 1 decider at the gate."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Vikash Agrawal", email = "vikashagrawal1990@gmail.com" }]
dependencies = [
  "strands-agents>=1.64,<2",
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# The real System 1 model, run locally with `strands-decider serve`.
decider = ["strands-decider>=0.2"]
# OpenTelemetry export from the application process (Lambda uses the ADOT layer instead).
otel = ["opentelemetry-exporter-otlp-proto-http>=1.27"]

[project.scripts]
agent-factory = "agent_factory.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls Amazon Bedrock and needs AWS credentials"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "W"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
